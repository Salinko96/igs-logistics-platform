name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/igs_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/igs_ci
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  playwright-public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/igs_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/igs_ci
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-public-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  playwright-secure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_ORG_A_EMAIL: ${{ secrets.E2E_ORG_A_EMAIL }}
      E2E_ORG_A_PASSWORD: ${{ secrets.E2E_ORG_A_PASSWORD }}
      E2E_ORG_A_CASE_ID: ${{ secrets.E2E_ORG_A_CASE_ID }}
      E2E_ORG_B_EMAIL: ${{ secrets.E2E_ORG_B_EMAIL }}
      E2E_ORG_B_PASSWORD: ${{ secrets.E2E_ORG_B_PASSWORD }}
      E2E_ORG_B_CASE_ID: ${{ secrets.E2E_ORG_B_CASE_ID }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ env.PLAYWRIGHT_BASE_URL != '' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ env.PLAYWRIGHT_BASE_URL != '' }}
        run: npm run test:e2e:secure
      - if: ${{ env.PLAYWRIGHT_BASE_URL == '' }}
        run: echo "Tests sécurisés ignorés, E2E_BASE_URL n'est pas configuré."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-secure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
